name: Publish attested release

on:
  push:
    tags:
      - "v*"

# Elevated scopes are granted per job, never to the whole workflow.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload the archive
      id-token: write # Sigstore OIDC for provenance
      attestations: write # record the provenance statement
    env:
      OPA_VERSION: "1.18.2"
      OPA_LINUX_AMD64_STATIC_SHA256: "9903e5125ac281104f2c4b7371d10cc3b74a98933743fcbfc174f9bf0ab20de8"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python validators
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes --requirement requirements-dev.txt

      - name: Install pinned OPA binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static" \
            --output "${RUNNER_TEMP}/opa"
          echo "${OPA_LINUX_AMD64_STATIC_SHA256}  ${RUNNER_TEMP}/opa" | sha256sum --check --strict
          chmod 0755 "${RUNNER_TEMP}/opa"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Verify the tag matches the declared version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$tag" != "v${version}" ]]; then
            echo "Tag ${tag} does not match VERSION ${version}" >&2
            exit 1
          fi

      - name: Run structural and Rego gates
        run: make validate

      - name: Verify checked-in release manifest
        run: make manifest-check

      - name: Build the reproducible archive
        shell: bash
        env:
          # The manifest was verified above, and Graphviz output is version-dependent,
          # so diagram refresh stays a local gate rather than a release dependency.
          PACKAGE_ALLOW_MISSING_GRAPHVIZ: "1"
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          archive="${RUNNER_TEMP}/mcp-agent-identity-reference-${version}.zip"
          make package PACKAGE_OUT="${archive}"
          echo "ARCHIVE=${archive}" >> "${GITHUB_ENV}"
          sha256sum "${archive}" | tee "${RUNNER_TEMP}/archive.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          notes="${RUNNER_TEMP}/notes.md"
          awk -v v="## ${version} " '
            index($0, v) == 1 {capture = 1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md > "${notes}"
          {
            echo
            echo "### Verifying this release"
            echo
            echo '```bash'
            echo "gh attestation verify mcp-agent-identity-reference-${version}.zip \\"
            echo "  --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "Archive SHA-256:"
            echo
            echo '```'
            awk '{print $1}' "${RUNNER_TEMP}/archive.sha256"
            echo '```'
            echo
            echo "The archive is byte-reproducible from this tag with \`make package\`."
          } >> "${notes}"
          gh release create "${GITHUB_REF_NAME}" "${ARCHIVE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${notes}" \
            --verify-tag
