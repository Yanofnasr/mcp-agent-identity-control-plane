name: Validate reference package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPA_VERSION: "1.18.2"
      OPA_LINUX_AMD64_STATIC_SHA256: "9903e5125ac281104f2c4b7371d10cc3b74a98933743fcbfc174f9bf0ab20de8"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python validators
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes --requirement requirements-dev.txt

      - name: Install pinned OPA binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static" \
            --output "${RUNNER_TEMP}/opa"
          echo "${OPA_LINUX_AMD64_STATIC_SHA256}  ${RUNNER_TEMP}/opa" | sha256sum --check --strict
          chmod 0755 "${RUNNER_TEMP}/opa"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/opa" version

      - name: Run structural and Rego gates
        run: make validate

      - name: Verify checked-in release manifest
        run: make manifest-check
